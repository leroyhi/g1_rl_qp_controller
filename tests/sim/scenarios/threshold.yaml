# The fall switch's threshold from the gamepad: square lowers it by 0.01, triangle raises it by 0.01, within
# [0.01, 0.99]. Holding a button counts once. Check G1RLQPController_FallSwitch_threshold in the log: 0.9166 (the
# bundle's), 0.8866 at 2.4 s, 0.8966 at 3.6 s, 0.99 from 5.5 s, then 0.01 from about 24 s, where p is above it and
# the recovery policy takes over.
duration: 30.0
fall_height: 0.4
fall_tilt_deg: 80.0
fake_joystick: true
events:
  - {t: 0.05, pad: {left: [0.5, 0.5], right: [0.5, 0.5]}}
  - {t: 1.0, pad: {cross: true}}
  - {t: 1.1, pad: {cross: false}}
  # Square three times, the third held for 1 s: -0.03
  - {t: 2.0, pad: {square: true}}
  - {t: 2.1, pad: {square: false}}
  - {t: 2.2, pad: {square: true}}
  - {t: 2.3, pad: {square: false}}
  - {t: 2.4, pad: {square: true}}
  - {t: 3.4, pad: {square: false}}
  # Triangle once: +0.01
  - {t: 3.6, pad: {triangle: true}}
  - {t: 3.7, pad: {triangle: false}}
  # Both at once: no change
  - {t: 4.0, pad: {triangle: true, square: true}}
  - {t: 4.1, pad: {triangle: false, square: false}}
  # Triangle ten times: clamped at 0.99
  - {t: 4.5, pad: {triangle: true}}
  - {t: 4.6, pad: {triangle: false}}
  - {t: 4.7, pad: {triangle: true}}
  - {t: 4.8, pad: {triangle: false}}
  - {t: 4.9, pad: {triangle: true}}
  - {t: 5.0, pad: {triangle: false}}
  - {t: 5.1, pad: {triangle: true}}
  - {t: 5.2, pad: {triangle: false}}
  - {t: 5.3, pad: {triangle: true}}
  - {t: 5.4, pad: {triangle: false}}
  - {t: 5.5, pad: {triangle: true}}
  - {t: 5.6, pad: {triangle: false}}
  - {t: 5.7, pad: {triangle: true}}
  - {t: 5.8, pad: {triangle: false}}
  - {t: 5.9, pad: {triangle: true}}
  - {t: 6.0, pad: {triangle: false}}
  - {t: 6.1, pad: {triangle: true}}
  - {t: 6.2, pad: {triangle: false}}
  - {t: 6.3, pad: {triangle: true}}
  - {t: 6.4, pad: {triangle: false}}
  # Square a hundred times: clamped at 0.01
