# Run with: mc_mujoco -f etc/mc_rtc_g1.yaml --torque-control
# Overrides ~/.config/mc_rtc/mc_rtc.yaml for this controller only.
MainRobot: G1_mode_5
Enabled: G1RLQPController
Timestep: 0.002
IncludeHalfSitController: false
# Sticks: command. Cross: walking policy. Circle: recovery policy. Both arm the policy if needed.
Plugins: [mc_joystick_plugin]

# GUI state published at 50 Hz, the policy rate, so that scripts/fall_switch_monitor.py gets every value of p. Merged
# into mc_rtc's GUIServer section: its IPC and TCP settings are kept.
GUIServer:
  Enable: true
  Timestep: 0.02
