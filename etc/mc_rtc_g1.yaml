# Run with: mc_mujoco -f etc/mc_rtc_g1.yaml --torque-control
# Overrides ~/.config/mc_rtc/mc_rtc.yaml for this controller only.
MainRobot: G1_29dof
Enabled: G1RLQPController
Timestep: 0.002
IncludeHalfSitController: false
# No joystick by default: until its first event, mc_joystick_plugin reports the sticks at (0, 0), which
# RLuseJoyStickInputs reads as a full-scale command. Command through the GUI instead.
Plugins: []
