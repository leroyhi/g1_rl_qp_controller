---
Managed: false
StepByStep: true
IdleKeepState: false

StatesLibraries:
  - "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
  - "@MC_STATES_RUNTIME_INSTALL_PREFIX@"
StatesFiles:
  - "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
  - "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"
VerboseStateFactory: false

robots:
  ground:
    module: env/ground

robot:
  base_body: pelvis

# Joint limits enforced by the QP and by the bypass torque clip.
limits:
  # Each joint uses the more conservative of its URDF limits and this file.
  plant: "@CMAKE_CURRENT_SOURCE_DIR@/policies/fall_switch/plant.json"
  # plant.json position band compared with the URDF: soft (0.9 shrink, as advised by the bundle README) or hard.
  position: soft
  # Add the armature to the QP's mass matrix, as armature = kp / (2 pi f)^2. The URDF has none, so the QP would
  # see the ankles and wrists about 20 times lighter than they are, and its CBF would bound their torque accordingly.
  armature_natural_frequency_hz: 10.0

# CBF-QP parameters. The QP has no contact in its model, so it sees a stance foot as free: its acceleration bounds
# become torque bounds of (lambda^2 / 4 zeta^2) * margin * inertia. lambda = 1 / dt keeps them above the 35 Nm of the
# ankles down to about 0.1 rad from a limit. At the template's 200 the QP is active on 1.3% of the walking ticks,
# against 0.01% here. The other values are the template defaults, not tuned for the G1 yet.
cbf:
  velocity_percent: 0.9
  position_percent: 0.01
  joint_limit:
    zeta: 1.2
    lambda: 500.0
  self_collision:
    zeta: 1.2
    lambda: 200.0

collisions:
  - type: collision
    useMinimal: true

# Constraint examples. Keep only constraints supported by your robot and application.
# constraints:
#   - type: contact
#     contactType: acceleration
#   - type: compoundJoint

# Simulation pipeline: encoders and the ground-truth floating base of mc_mujoco.
# On hardware the FloatingBase sensor does not exist: replace BodySensor with an estimator.
ObserverPipelines:
  name: MainPipeline
  gui: true
  log: true
  observers:
    - type: Encoder
      velocity: encoderVelocities
    - type: BodySensor
      update: true
      bodySensor: FloatingBase

states: {}
transitions:
  - [G1RLQPController_Initial, OK, G1RLQPController_Initial, Strict]
init: G1RLQPController_Initial

policies_root: "@CMAKE_CURRENT_SOURCE_DIR@/policies"
default_policy: weak

# Gain ratio while disarmed, on top of the policy's gains: Kp * ratio, Kd * sqrt(ratio). The policy's gains cannot hold
# a passive robot up: in mc_mujoco it falls within 2 s at ratios 1, 3 and 5, and stands at 8. Tuned in simulation only.
hold_pd_gains_ratio: 8.0

# Hands control over to the catch policy when the walking policy is about to fall.
fall_switch:
  enabled: true
  folder: "@CMAKE_CURRENT_SOURCE_DIR@/policies/fall_switch"
  walking_policy: weak
  recovery_policy: recovery_v0
  recovery_onnx: "@CMAKE_CURRENT_SOURCE_DIR@/policies/recovery_v0/recovery_v0.onnx"
  # Source of tilt_rate. It must give the angular velocity in the pelvis frame. On hardware, a gyro on the pelvis.
  gyro_sensor: FloatingBase
  # Not settled: the bundle's README says 25 (0.5 s), its limit_kernel.json says 10.
  release_dwell_steps: 25
